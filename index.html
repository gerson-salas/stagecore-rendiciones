<script>
/* ---------- almacenamiento (IndexedDB) ---------- */
const DB = 'stagecore', STORE = 'kv';
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
 r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readonly').objectStore(STORE).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function kvSet(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}

/* ---------- nube (Supabase) ---------- */
const SB = {
  url: 'https://uidkriwygqncdwhogwrm.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZGtyaXd5Z3FuY2R3aG9nd3JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjQyMzUsImV4cCI6MjEwMzM0MDIzNX0.PS5KL0KQksiAv2Ov3-Qm3OTQddO7pWT3Byhqck2lxyg'
};
const SUFIJO = 'sc26';            // el PIN viaja como contraseña PIN+sufijo (mínimo de Supabase)
const TABLAS = [['usuarios','correo'],['eventos','id'],['gastos','id'],['rendiciones','id']];
let TOKEN = null, SYNC = {estado:'local', pend:0, cuando:null};
const FOTOS = {};

const hAuth = () => ({apikey:SB.key,'Content-Type':'application/json'});
const hApi = () => ({apikey:SB.key,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'});

async function sbToken(body, q){
  const r = await fetch(SB.url+'/auth/v1/'+q, {method:'POST',headers:hAuth(),body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) return {error: j.error_description || j.msg || j.error || 'error'};
  if(j.access_token){ TOKEN=j.access_token; await kvSet('refresh', j.refresh_token); }
  return {ok:true, sesion: !!j.access_token};
}
const sbEntrar   = (correo,pin) => sbToken({email:correo,password:pin+SUFIJO}, 'token?grant_type=password');
const sbCrear    = (correo,pin) => sbToken({email:correo,password:pin+SUFIJO}, 'signup');
async function sbRetomar(){
  const rt = await kvGet('refresh'); if(!rt) return false;
  const r = await sbToken({refresh_token:rt}, 'token?grant_type=refresh_token');
  return !!r.ok;
}

async function sbRecuperar(correo){
  const volver = location.origin + location.pathname;
  const r = await fetch(SB.url+'/auth/v1/recover?redirect_to='+encodeURIComponent(volver),
    {method:'POST',headers:hAuth(),body:JSON.stringify({email:correo})});
  if(r.ok) return {ok:true};
  const j = await r.json().catch(()=>({}));
  return {error: j.msg || j.error_description || ('error '+r.status)};
}

async function sbQuienSoy(){
  const r = await fetch(SB.url+'/auth/v1/user',{headers:hApi()});
  if(!r.ok) return null;
  const j = await r.json().catch(()=>null);
  return j && j.email ? j.email.toLowerCase() : null;
}
async function sbNuevaClave(pin){
  const r = await fetch(SB.url+'/auth/v1/user',{method:'PUT',headers:hApi(),body:JSON.stringify({password:pin+SUFIJO})});
  if(r.ok) return {ok:true};
  const j = await r.json().catch(()=>({}));
  return {error: j.msg || j.error_description || ('error '+r.status)};
}

async function sbLeer(tabla){
  const r = await fetch(SB.url+'/rest/v1/'+tabla+'?select=*', {headers:hApi()});
  if(!r.ok) throw new Error(tabla+' '+r.status);
  return r.json();
}
async function sbGuardar(tabla, filas){
  if(!filas.length) return;
  const r = await fetch(SB.url+'/rest/v1/'+tabla+'?on_conflict=id',
    {method:'POST',headers:{...hApi(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(filas)});
  if(!r.ok) throw new Error(tabla+' '+r.status+' '+(await r.text()).slice(0,120));
}
async function sbBorrar(tabla, id){
  await fetch(SB.url+'/rest/v1/'+tabla+'?id=eq.'+encodeURIComponent(id), {method:'DELETE',headers:hApi()});
}

async function subirFoto(id, dataUrl){
  const blob = await (await fetch(dataUrl)).blob();
  const nombre = id+'.jpg';
  const r = await fetch(SB.url+'/storage/v1/object/boletas/'+nombre,
    {method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+TOKEN,'Content-Type':blob.type||'image/jpeg','x-upsert':'true'},body:blob});
  return r.ok ? 'sb:'+nombre : null;
}
async function bajarFoto(marca){
  try{
    const r = await fetch(SB.url+'/storage/v1/object/boletas/'+marca.slice(3), {headers:{apikey:SB.key,Authorization:'Bearer '+TOKEN}});
    if(!r.ok) return null;
    return URL.createObjectURL(await r.blob());
  }catch(e){ return null; }
}
function imgAttrs(f){
  if(!f) return 'src=""';
  if(f.slice(0,5)==='data:') return 'src="'+f+'"';
  return FOTOS[f] ? 'src="'+FOTOS[f]+'"' : 'src="" data-sb="'+esc(f)+'"';
}
async function hidratarFotos(){
  for(const el of document.querySelectorAll('img[data-sb]')){
    const k = el.dataset.sb;
    if(FOTOS[k]){ el.src=FOTOS[k]; el.removeAttribute('data-sb'); continue; }
    if(!TOKEN) continue;
    const u = await bajarFoto(k);
    if(u){ FOTOS[k]=u; el.src=u; el.removeAttribute('data-sb'); }
  }
}

function pendientes(snap){
  let n = 0;
  const adm = !!((D.usuarios||[]).find(u=>norm(u.correo)===norm(D.sesion))||{}).admin;
  for(const [tb,pk] of TABLAS){
    if(tb==='eventos' && !adm) continue;
    const prev = (snap||{})[tb] || {};
    for(const f of (D[tb]||[])) if(prev[tb==='usuarios'?norm(f.correo):String(f[pk])] !== JSON.stringify(f)) n++;
  }
  for(const g of (D.gastos||[])) if(g.foto && g.foto.slice(0,5)==='data:') n++;
  return n;
}

let syncCorriendo = false;
async function sincronizar(manual){
  if(syncCorriendo) return;
  if(!navigator.onLine){ SYNC.estado='sinred'; return; }
  if(!TOKEN && !(await sbRetomar())){ SYNC.estado='local'; if(manual) toast('Sin sesión en la nube. Vuelve a entrar con tu PIN.'); return; }
  syncCorriendo = true; SYNC.estado='subiendo'; render();
  try{
    let snap = (await kvGet('snap')) || {};
    // fotos primero: la boleta viaja con la URL, no con la imagen
    const marcas = {};
    for(const g of (D.gastos||[])){
      if(g.foto && g.foto.slice(0,5)==='data:'){
        const marca = await subirFoto(g.id, g.foto);
        if(marca){ FOTOS[marca]=g.foto; g.foto=marca; }
      }
      if(g.foto) marcas[g.id] = g.foto;
    }
    for(const r of (D.rendiciones||[])){
      for(const g of (r.gastos||[])){
        if(!g.foto || g.foto.slice(0,5)!=='data:') continue;
        if(marcas[g.id] && marcas[g.id].slice(0,3)==='sb:'){ g.foto = marcas[g.id]; continue; }
        const marca = await subirFoto(g.id, g.foto);
        if(marca){ FOTOS[marca]=g.foto; g.foto=marca; marcas[g.id]=marca; }
      }
    }
    const adm = !!(yo()||{}).admin;
    const rechazos = [];
    for(const [tb,pk] of TABLAS){
      if(tb==='eventos' && !adm) continue;          // la agenda la manda la administración
      try{
        const local = D[tb]||[], prev = snap[tb]||{};
        const cambios = local.filter(f => prev[tb==='usuarios'?norm(f.correo):String(f[pk])] !== JSON.stringify(f));
        await sbGuardar(tb, cambios.map(f=>({
          id: tb==='usuarios' ? norm(f.correo) : String(f[pk]),
          datos: tb==='usuarios' ? (({pin, ...resto}) => resto)(f) : f,
          actualizado: new Date().toISOString()
        })));
        for(const id of Object.keys(prev)) if(!local.some(f=>(tb==='usuarios'?norm(f.correo):String(f[pk]))===id)) await sbBorrar(tb, id);
      }catch(e){
        if(/42501|401|403/.test(e.message)) rechazos.push(tb); else throw e;
      }
    }
    SYNC.estado='bajando'; render();
    for(const [tb,pk] of TABLAS){
      const remoto = await sbLeer(tb);
      const local = D[tb]||[], prev = snap[tb]||{};
      let nuevos = remoto.map(r=>r.datos).filter(Boolean);

      if(tb==='usuarios'){
        // la nube puede traer correos con mayúsculas de versiones anteriores
        for(const f of remoto){
          if(f.datos && String(f.id) !== norm(f.datos.correo)) await sbBorrar('usuarios', f.id);
        }
        nuevos = nuevos.map(r => {
          const c = norm(r.correo);
          const mio = local.find(l => norm(l.correo)===c);
          return {...r, correo:c, pin: (mio && mio.pin) || r.pin || ''};
        });
      }
      if(tb==='gastos') nuevos = nuevos.map(r => ({...r, usuario: norm(r.usuario)}));
      if(tb==='rendiciones') nuevos = nuevos.map(r => ({...r, usuario: norm(r.usuario),
        gastos: (r.gastos||[]).map(g=>({...g, usuario: norm(g.usuario)}))}));

      const clave = (f) => tb==='usuarios' ? norm(f.correo) : String(f[pk]);
      const idsRemotos = new Set(nuevos.map(clave));
      // lo que quedó solo aquí y nunca estuvo en la nube (agregado sin señal) se conserva
      const soloLocal = (tb==='eventos' && !adm) ? []
        : local.filter(f => !idsRemotos.has(clave(f)) && prev[clave(f)]===undefined);

      // una sola ficha por clave: gana la que trae nombre completo, rol real y PIN
      const mapa = new Map();
      for(const f of nuevos.concat(soloLocal)){
        const k = clave(f), ya = mapa.get(k);
        if(!ya){ mapa.set(k, f); continue; }
        mapa.set(k, tb==='usuarios' ? {
          ...ya, ...f,
          nombre: (ya.nombre||'').includes(' ') ? ya.nombre : (f.nombre || ya.nombre),
          rol: (ya.rol==='jefe' || f.rol==='jefe') ? 'jefe' : (ya.rol || f.rol),
          admin: !!(ya.admin || f.admin),
          activo: !!(ya.activo || f.activo),
          pin: ya.pin || f.pin || ''
        } : {...ya, ...f});
      }
      D[tb] = [...mapa.values()];
    }
    snap = {};
    for(const [tb,pk] of TABLAS){
      snap[tb]={};
      for(const f of (D[tb]||[])) snap[tb][tb==='usuarios'?norm(f.correo):String(f[pk])]=JSON.stringify(f);
    }
    await kvSet('snap', snap);
    await kvSet('data', D);
    SYNC.pend = pendientes(snap); SYNC.cuando = new Date();
    if(adm && rechazos.includes('eventos')){
      SYNC.estado='error';
      SYNC.motivo = 'La base rechazó la agenda: tu correo ('+D.sesion+') no está en la política eventos_admin de Supabase.';
      if(manual) toast(SYNC.motivo);
    } else {
      SYNC.estado='ok'; SYNC.motivo=null;
      if(manual) toast(rechazos.length
        ? 'Boletas sincronizadas. La agenda solo la edita la administración.'
        : 'Todo sincronizado con la nube.');
    }
  }catch(e){
    SYNC.estado='error';
    SYNC.motivo = /PGRST205|404|Could not find/i.test(e.message)
      ? 'Falta crear las tablas: corre supabase.sql en el SQL Editor.'
      : (/401|403|JWT/i.test(e.message) ? 'Sesión vencida. Vuelve a entrar con tu PIN.' : 'No se pudo sincronizar: '+e.message);
    if(manual) toast(SYNC.motivo);
  }finally{ syncCorriendo=false; render(); }
}

/* ---------- datos iniciales ---------- */
const USUARIOS = [
 {nombre:'Gerson Salas',cargo:'Administrador',correo:'gerson@stagecore.cl',rol:'jefe',pin:'1234',activo:true,admin:true},
 {nombre:'Alexis Salas',cargo:'Administrador',correo:'alexis@stagecore.cl',rol:'jefe',pin:'1234',activo:true,admin:true}
];
const EVENTOS = [];                 // la agenda la carga la administración
const DEMO = ['e1','e2','e3','e4']; // eventos de la demostración inicial
const CATS = ['Transporte','Insumos','Alojamiento','Alimentación','Bodega','Arriendo','Honorarios'];
const RET_HON = 0.1525; // retención boleta de honorarios — ajustable por año
const CODIGO_INVITACION = 'SC-2026';

let D = null;                       // datos persistidos
let U = {view:'login',paso:'inicio',correo:'',pin:'',err:'',intentos:0,bloqueo:0,tab:'inicio',cap:null,foco:'monto',rend:null,sheet:null,toast:'',firmado:false};
const norm = (c) => String(c==null?'':c).trim().toLowerCase();
const delLogin = () => (D.usuarios||[]).find(u=>norm(u.correo)===norm(U.correo)) || null;
const largoPin = () => { const u=delLogin(); return (u && u.pin) ? u.pin.length : 4; };

const esInterna = (u) => /@stagecore\.cl$/i.test(u.correo||'') && !u.externo;
const codigoActual = () => (D && D.codigo) || CODIGO_INVITACION;
window.setProv = (v) => { if(U.cap) U.cap.prov = v; };
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__ip = e; });
const uid = () => Math.random().toString(36).slice(2,9);
const money = (n) => '$' + (Number(n)||0).toLocaleString('es-CL');
const hoy = () => new Date().toISOString().slice(0,10);
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yo = () => (D.usuarios||[]).find(u=>norm(u.correo)===norm(D.sesion)) || null;
const evActivo = () => (D.eventos||[]).find(e=>e.id===D.eventoActivo) || (D.eventos||[])[0] || null;
const misGastos = () => (D.gastos||[]).filter(g=>g.usuario===D.sesion && g.evento===(evActivo()||{}).id);

async function save(){
  await kvSet('data', D);
  SYNC.pend = pendientes(await kvGet('snap'));
  clearTimeout(window.__sy);
  window.__sy = setTimeout(()=>sincronizar(false), 1200);
}
function toast(t){ U.toast=t; render(); clearTimeout(window.__t); window.__t=setTimeout(()=>{U.toast='';render();},3000); }

/* ---------- arranque ---------- */
(async function boot(){
  D = await kvGet('data');
  if(!D){ D = {v:3,usuarios:USUARIOS.map(u=>({...u})),eventos:[],gastos:[],rendiciones:[],eventoActivo:null,sesion:null}; await save(); }
  D.usuarios = D.usuarios || USUARIOS.map(u=>({...u}));
  D.eventos = D.eventos || EVENTOS.map(e=>({...e}));
  D.gastos = D.gastos || []; D.rendiciones = D.rendiciones || [];
  if(!D.v || D.v < 2){                      // migración: solo administración interna + cuentas invitadas
    const invitadas = D.usuarios.filter(u=>!/@stagecore\.cl$/i.test(u.correo||''));
    D.usuarios = USUARIOS.map(u=>({...u})).concat(invitadas);
    D.v = 2; await save();
  }
  if(D.v < 3){                              // migración: fuera los eventos de demostración sin boletas
    D.eventos = D.eventos.filter(e => !DEMO.includes(e.id) || (D.gastos||[]).some(g=>g.evento===e.id));
    if(!D.eventos.some(e=>e.id===D.eventoActivo)) D.eventoActivo = (D.eventos[0]||{}).id || null;
    D.v = 3; await save();
  }
  if(!D.v || D.v < 4){                      // migración: correos en minúsculas, sin duplicados
    const mapa = new Map();
    for(const u of D.usuarios){
      const k = norm(u.correo), ya = mapa.get(k);
      const fila = {...u, correo:k};
      if(!ya) mapa.set(k, fila);
      else mapa.set(k, {                     // se conserva la ficha con datos reales
        ...ya, ...fila,
        nombre: (ya.nombre && ya.nombre.includes(' ')) ? ya.nombre : (fila.nombre||ya.nombre),
        rol: ya.rol==='jefe'||fila.rol==='jefe' ? 'jefe' : (ya.rol||fila.rol),
        admin: !!(ya.admin || fila.admin),
        pin: ya.pin || fila.pin,
        activo: !!(ya.activo || fila.activo)
      });
    }
    D.usuarios = [...mapa.values()];
    for(const g of (D.gastos||[])) g.usuario = norm(g.usuario);
    for(const r of (D.rendiciones||[])){
      r.usuario = norm(r.usuario);
      for(const g of (r.gastos||[])) g.usuario = norm(g.usuario);
    }
    D.sesion = D.sesion ? norm(D.sesion) : null;
    D.v = 4; await kvSet('snap', null); await save();
  }
  if(D.sesion && !D.usuarios.some(u=>norm(u.correo)===norm(D.sesion))){ D.sesion=null; await save(); }
  const bl = await kvGet('bloqueo');
  if(bl && bl.hasta > Date.now()){ U.correo=bl.correo||''; U.intentos=bl.intentos||0; U.bloqueo=bl.hasta; }
  U.view = D.sesion ? 'app' : 'login'; U.paso = 'inicio';
  if(D.sesion && yo() && yo().rol==='jefe') U.tab='bandeja';

  // enlace de recuperación del correo: #access_token=…&type=recovery
  const hash = location.hash;
  if(hash.includes('access_token')){
    const p = new URLSearchParams(hash.slice(1));
    if(p.get('type')==='recovery' && p.get('access_token')){
      TOKEN = p.get('access_token');
      if(p.get('refresh_token')) await kvSet('refresh', p.get('refresh_token'));
      const correo = norm(await sbQuienSoy());
      history.replaceState(null,'',location.pathname);
      if(correo){ D.sesion=null; U.view='login'; U.paso='recuperar'; U.correo=correo; U.pin=''; U.err=''; U.bloqueo=0; }
      else { U.err='El enlace ya venció. Pide otro con "Olvidé mi PIN".'; }
    }
  }
  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  SYNC.pend = pendientes(await kvGet('snap'));
  if(D.sesion) sincronizar(false);
  window.addEventListener('online', ()=>sincronizar(false));
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && D.sesion) sincronizar(false); });
  setInterval(()=>{ if(D.sesion && !document.hidden) sincronizar(false); }, 60000);
})();

/* ---------- render ---------- */
function render(){
  const el = document.getElementById('app');
  el.innerHTML = (U.view==='login' ? vLogin() : vApp())
    + (U.toast ? '<div class="toast">'+esc(U.toast)+'</div>' : '')
    + (U.sheet ? vSheet() : '');
  if(U.view==='app' && U.rend!=null && !U.sheet) initSig();
  hidratarFotos();
}

function largoPinNuevo(){ return 4; }   // se puede reforzar a 6 desde Perfil → Cambiar mi PIN
function keys(kind){
  const tercera = (U.view==='app' && U.cap && U.foco==='rut') ? 'K' : (U.view==='app' && U.cap && U.foco==='folio' ? '00' : (kind==='k' ? '' : '000'));
  const ks = ['1','2','3','4','5','6','7','8','9',tercera,'0','⌫'];
  return '<div class="keys">'+ks.map(k=>k?`<button data-a="${kind}" data-k="${k}">${k}</button>`:'<div></div>').join('')+'</div>';
}
function ini(n){const p=String(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'');}

function textoSync(){
  if(SYNC.estado==='subiendo') return 'SUBIENDO…';
  if(SYNC.estado==='bajando') return 'ACTUALIZANDO…';
  if(SYNC.estado==='error') return 'ERROR · REINTENTAR ↻';
  if(!navigator.onLine) return SYNC.pend ? SYNC.pend+' EN ESPERA' : 'SIN SEÑAL';
  if(SYNC.pend) return SYNC.pend+' POR SUBIR ↻';
  return SYNC.cuando ? 'EN LA NUBE '+SYNC.cuando.toTimeString().slice(0,5) : 'SINCRONIZAR ↻';
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a, u = yo();
  if(a==='bg' && e.target.classList.contains('sheet')){ U.sheet=null; return render(); }
  switch(a){
    case 'ir': {
      const c=(document.getElementById('lc').value||'').trim().toLowerCase();
      if(!/.+@.+\..+/.test(c)){ U.err='Escribe un correo válido.'; return render(); }
      U.correo=norm(c); U.pin=''; U.err=''; U.nuevo=null;
      const us=delLogin();
      U.paso = (us && us.reset) ? 'nuevo' : 'pin';
      return render();
    }
    case 'ext': U.paso='externo'; U.err=''; U.nuevo=null; return render();
    case 'extok': {
      const n=(document.getElementById('xn').value||'').trim();
      const c=(document.getElementById('xc').value||'').trim().toLowerCase();
      const k=(document.getElementById('xk').value||'').trim().toUpperCase();
      if(n.split(/\s+/).length<2){ U.err='Escribe tu nombre y apellido.'; return render(); }
      if(!/.+@.+\..+/.test(c)){ U.err='Escribe un correo válido.'; return render(); }
      if(k!==codigoActual()){ U.err='El código de invitación no es correcto.'; return render(); }
      U.correo=norm(c); U.pin=''; U.err='';
      const ya=delLogin();
      if(ya){ U.nuevo=null; U.paso=(ya.activo && ya.pin)?'pin':'nuevo'; return render(); }
      U.nuevo={nombre:n,cargo:'Carga boletas · acceso por invitación',correo:norm(c),rol:'campo',pin:'',activo:false,externo:true};
      U.paso='nuevo'; return render();
    }
    case 'back':
      if(U.paso==='externo'){ U.paso='inicio'; }
      else { U.paso = U.nuevo ? 'externo' : 'inicio'; }
      U.pin=''; U.err=''; return render();
    case 'olvide': {
      if(!navigator.onLine) return toast('Necesitas señal para recuperar tu PIN.');
      const r = await sbRecuperar(U.correo);
      return toast(r.error ? 'No se pudo enviar: '+r.error
        : 'Te enviamos un correo a '+U.correo+' con el enlace para crear un PIN nuevo.');
    }
    case 'k': {
      const n = U.paso==='pin' ? largoPin() : largoPinNuevo();
      const k=b.dataset.k; U.err='';
      if(k==='⌫') U.pin=U.pin.slice(0,-1); else if(U.pin.length<n) U.pin+=k;
      return render();
    }
    case 'enter': {
      if(U.bloqueo > Date.now()) return render();
      const n = U.paso==='pin' ? largoPin() : largoPinNuevo();
      if(U.pin.length<n){ U.err='Ingresa los '+n+' dígitos.'; return render(); }

      if(U.paso==='recuperar'){
        const r = await sbNuevaClave(U.pin);
        if(r.error){ U.pin=''; U.err='El enlace ya venció. Pide otro con "Olvidé mi PIN".'; return render(); }
        const e = await sbEntrar(U.correo, U.pin);
        if(e.error){ U.pin=''; U.err=e.error; return render(); }
        let us = delLogin();
        if(!us){
          try{
            const filas = await sbLeer('usuarios');
            const f = filas.map(x=>x.datos).find(x=>x && norm(x.correo)===norm(U.correo));
            us = {...(f || {nombre:U.correo.split('@')[0],cargo:'Carga boletas',correo:U.correo,rol:'campo',externo:true}), correo:U.correo};
            D.usuarios.push(us);
          }catch(err){ U.err='No pude recuperar tu ficha. Reintenta.'; return render(); }
        }
        us.pin=U.pin; us.activo=true; us.reset=false;
        D.sesion=norm(U.correo); await save();
        U.view='app'; U.paso='inicio'; U.pin=''; U.err=''; U.intentos=0; U.bloqueo=0; await kvSet('bloqueo', null);
        U.tab = us.rol==='jefe'?'bandeja':'inicio';
        sincronizar(false);
        return toast('PIN nuevo guardado. Hola, '+us.nombre.split(' ')[0]+'.');
      }

      if(U.paso==='nuevo'){
        if(!navigator.onLine){ U.err='Necesitas señal la primera vez en este teléfono.'; return render(); }
        {
          let r = await sbCrear(U.correo, U.pin);
          if(r.error && /already|registered|exists/i.test(r.error)){
            r = await sbEntrar(U.correo, U.pin);
            if(r.error){ U.pin=''; U.err='Ese correo ya tiene un PIN. Escribe el que creaste, o pide a la administración que lo reinicie.'; return render(); }
          }
          if(r.error){ U.err=r.error; return render(); }
          if(!r.sesion){ U.err='Falta desactivar "Confirm email" en Supabase → Authentication → Email.'; return render(); }
        }
        if(U.nuevo) D.usuarios.push({...U.nuevo, pin:U.pin, activo:true, reset:false});
        else { const us=delLogin(); us.pin=U.pin; us.activo=true; us.reset=false; }
        D.sesion=norm(U.correo);
        await save(); U.view='app'; U.pin=''; U.nuevo=null; U.intentos=0; U.tab = yo().rol==='jefe'?'bandeja':'inicio';
        sincronizar(false);
        return toast('Cuenta activada. Bienvenido, '+yo().nombre.split(' ')[0]+'.');
      }

      const fallo = async (msg) => {
        U.intentos++; U.pin='';
        if(U.intentos>=5){ U.bloqueo = Date.now() + Math.min(300, 15*Math.pow(2, U.intentos-5))*1000; U.err=''; }
        else U.err = msg;
        await kvSet('bloqueo', {correo:U.correo, intentos:U.intentos, hasta:U.bloqueo});
        render();
      };

      let us = delLogin();
      if(navigator.onLine){
        const r = await sbEntrar(U.correo, U.pin);
        if(r.error){
          // la cuenta puede existir solo en este teléfono y aún no en la nube
          if(us && us.pin && U.pin===us.pin){
            const c = await sbCrear(U.correo, U.pin);
            if(c.ok && !c.sesion){ U.err='Falta desactivar "Confirm email" en Supabase → Authentication → Email.'; return render(); }
            if(c.error){ return fallo('Correo o PIN incorrecto.'); }
          } else return fallo('Correo o PIN incorrecto.');
        } else if(!us){
          // cuenta creada en otro teléfono: traer su ficha de la nube
          try{
            const filas = await sbLeer('usuarios');
            const f = filas.map(x=>x.datos).find(x=>x && norm(x.correo)===norm(U.correo));
            us = {...(f || {nombre:U.correo.split('@')[0],cargo:'Carga boletas',correo:U.correo,rol:'campo',externo:true}), correo:U.correo, pin:U.pin, activo:true};
            D.usuarios.push(us);
          }catch(e){ return fallo('No pude recuperar tu cuenta. Reintenta con señal.'); }
        }
      } else {
        if(!us || !us.pin){ U.pin=''; U.err='Necesitas señal la primera vez en este teléfono.'; return render(); }
        if(U.pin!==us.pin) return fallo('Correo o PIN incorrecto.');
      }

      us = delLogin();
      us.pin=U.pin; us.activo=true; us.reset=false;
      D.sesion=norm(U.correo); await save();
      U.view='app'; U.pin=''; U.err=''; U.intentos=0; U.bloqueo=0; await kvSet('bloqueo', null);
      U.tab = us.rol==='jefe'?'bandeja':'inicio';
      sincronizar(false);
      return toast('Hola, '+us.nombre.split(' ')[0]+'.');
    }
    case 'sync': return sincronizar(true);
    case 'salir': D.sesion=null; TOKEN=null; await kvSet('refresh',null); await save();
      U={...U,view:'login',paso:'inicio',correo:'',pin:'',err:'',nuevo:null,intentos:0,bloqueo:0,cap:null,rend:null,sheet:null}; return render();
    case 'tab': U.tab=b.dataset.t; U.sheet=null; return render();
    case 'sheet': U.sheet={t:b.dataset.s,id:b.dataset.id}; return render();
    case 'usarev': D.eventoActivo=b.dataset.id; await save(); U.tab='inicio';
      return toast('Trabajando en '+(D.eventos.find(e=>e.id===b.dataset.id)||{}).nombre+'.');
    case 'cerrar': U.sheet=null; return render();

    case 'cap': if(!evActivo()){ U.tab='agenda'; render(); return toast('Elige el evento antes de cargar la boleta.'); }
      U.cap={total:0,rut:'',folio:'',tipo:'Boleta',categoria:'Transporte',prov:'',foto:null,fecha:hoy()}; U.foco='monto'; U.sheet=null; return render();
    case 'capEv': D.eventoActivo=b.dataset.id; await save(); U.sheet=null;
      U.cap={total:0,rut:'',folio:'',tipo:'Boleta',categoria:'Transporte',prov:'',foto:null,fecha:hoy()}; U.foco='monto'; return render();
    case 'capx': U.cap=null; return render();
    case 'tipo': U.cap.tipo=b.dataset.t;
      if(U.cap.tipo==='Sin doc.'){U.cap.rut='';U.cap.folio='';U.foco='monto';} else U.foco='rut';
      if(U.cap.tipo==='Honorarios') U.cap.categoria='Honorarios';
      return render();
    case 'cat': U.cap.categoria=b.dataset.k; return render();
    case 'foco': if(!(U.cap.tipo==='Sin doc.' && b.dataset.f!=='monto')) U.foco=b.dataset.f; return render();
    case 'ck': {
      const k=b.dataset.k, c=U.cap;
      if(U.foco==='monto'){ let s=String(c.total||''); s = k==='⌫'? s.slice(0,-1) : (s.length>=9? s : s+k); c.total=Number(s||0); }
      else if(U.foco==='rut'){ c.rut = k==='⌫'? c.rut.slice(0,-1) : (c.rut.length>=9? c.rut : c.rut+k); }
      else { c.folio = k==='⌫'? c.folio.slice(0,-1) : (c.folio.length>=8? c.folio : c.folio+k); }
      return render();
    }
    case 'foto': U.fotoPara=null; document.getElementById('cam').click(); return;
    case 'fotoG': U.fotoPara=b.dataset.id; document.getElementById('cam').click(); return;
    case 'galeria': U.fotoPara=null; document.getElementById('gal').click(); return;
    case 'galeriaG': U.fotoPara=b.dataset.id; document.getElementById('gal').click(); return;
    case 'capsave': {
      const c=U.cap, sinDoc=c.tipo==='Sin doc.';
      if(c.total<=0) return toast('Ingresa el total del documento.');
      if(!sinDoc && (c.rut.length<8 || !c.folio)) return toast('Contabilidad necesita RUT y folio.');
      if(!evActivo()) return toast('Primero elige un evento en la Agenda.');
      D.gastos.push({id:uid(),usuario:D.sesion,evento:evActivo().id,total:c.total,tipo:c.tipo,rut:c.rut,folio:c.folio,
        categoria:c.categoria,proveedor:(c.prov||'').trim() || (c.tipo+(c.folio?' #'+c.folio:'')+' · '+c.categoria),foto:c.foto,fecha:c.fecha,estado:'cola'});
      await save(); U.cap=null; U.tab='inicio';
      return toast(c.foto? 'Boleta guardada en el teléfono.' : 'Guardada sin foto — recuerda adjuntarla.');
    }
    case 'borrar': {
      const g=(D.gastos||[]).find(x=>x.id===b.dataset.id);
      if(!confirm('¿Eliminar esta boleta'+(g?' de '+money(g.total):'')+'? No se puede deshacer.')) return;
      D.gastos=D.gastos.filter(x=>x.id!==b.dataset.id); await save(); U.sheet=null; return toast('Boleta eliminada.');
    }

    case 'cdsave': {
      const v=(document.getElementById('cd').value||'').trim().toUpperCase();
      if(v.length<4) return toast('El código debe tener al menos 4 caracteres.');
      D.codigo=v; await save(); U.sheet=null; return toast('Código actualizado: '+v);
    }
    case 'instalar': {
      if(window.__ip){ window.__ip.prompt(); window.__ip=null; return; }
      return toast('En iPhone: botón Compartir → Agregar a inicio. En Android: menú ⋮ → Instalar aplicación.');
    }
    case 'fotosR': {
      const r=D.rendiciones[U.rend]; let n=0;
      r.gastos.forEach((g,i)=>{ if(!g.foto) return; n++;
        setTimeout(()=>{ fetch(g.foto).then(x=>x.blob()).then(bl=>bajar(bl,'boleta-'+(g.folio||i+1)+'.jpg')); }, i*400); });
      return toast(n? 'Descargando '+n+' comprobante(s).' : 'Esta rendición no tiene fotos.');
    }
    case 'rendel': {
      if(!confirm('¿Quitar esta rendición de la bandeja? El CSV ya exportado no cambia.')) return;
      D.rendiciones.splice(U.rend,1); await save(); U.rend=null; return toast('Rendición quitada.');
    }
    case 'urol': {
      const x=D.usuarios.find(z=>z.correo===b.dataset.id);
      if(!x.admin) return toast('Solo las cuentas de administración STAGECORE aprueban rendiciones.');
      if(x.correo===D.sesion) return toast('No puedes cambiar tu propio rol.');
      if(x.rol==='jefe' && D.usuarios.filter(z=>z.rol==='jefe'&&z.activo).length<=1) return toast('Debe quedar al menos un aprobador activo.');
      x.rol = x.rol==='jefe'?'campo':'jefe';
      x.cargo = esInterna(x) ? (x.rol==='jefe'?'Aprobador':'Campo') : x.cargo;
      await save(); U.sheet=null; return toast(x.nombre.split(' ')[0]+' ahora '+(x.rol==='jefe'?'puede aprobar rendiciones.':'solo captura boletas.'));
    }
    case 'upin': {
      const x=D.usuarios.find(z=>z.correo===b.dataset.id);
      if(!x.pin && !x.activo){          // nunca entró: puede crear su PIN directo
        x.reset=true; await save(); U.sheet=null;
        return toast(x.nombre.split(' ')[0]+' crea su PIN al entrar con su correo.');
      }
      if(!navigator.onLine) return toast('Necesitas señal para enviar el enlace.');
      const r = await sbRecuperar(x.correo);
      U.sheet=null;
      return toast(r.error ? 'No se pudo enviar: '+r.error
        : 'Enlace enviado a '+x.correo+'. Con ese correo crea su PIN nuevo.');
    }
    case 'utog': {
      const x=D.usuarios.find(z=>z.correo===b.dataset.id);
      if(x.correo===D.sesion) return toast('No puedes suspender tu propia cuenta.');
      if(x.activo && x.rol==='jefe' && D.usuarios.filter(z=>z.rol==='jefe'&&z.activo).length<=1) return toast('Debe quedar al menos un aprobador activo.');
      x.activo=!x.activo; await save(); U.sheet=null;
      return toast(x.activo? 'Acceso reactivado.' : 'Acceso suspendido.');
    }
    case 'udel': {
      const c=b.dataset.id, x=D.usuarios.find(z=>z.correo===c);
      if(c===D.sesion) return toast('No puedes eliminar tu propia cuenta.');
      if(x.rol==='jefe' && D.usuarios.filter(z=>z.rol==='jefe'&&z.activo).length<=1) return toast('Debe quedar al menos un aprobador activo.');
      const n=(D.gastos||[]).filter(g=>g.usuario===c).length;
      if(!confirm('¿Eliminar la cuenta de '+x.nombre+'?'+(n?' Sus '+n+' boletas en este teléfono se mantienen.':''))) return;
      D.usuarios=D.usuarios.filter(z=>z.correo!==c); await save(); U.sheet=null;
      return toast('Cuenta eliminada.');
    }
    case 'evdel': {
      const id=b.dataset.id, e=D.eventos.find(z=>z.id===id);
      const gs=(D.gastos||[]).filter(g=>g.evento===id);
      if(D.eventos.length<=1) return toast('Debe quedar al menos un evento en la agenda.');
      if(!confirm('¿Eliminar «'+e.nombre+'»?'+(gs.length? ' Se borran también sus '+gs.length+' boleta(s).':''))) return;
      D.eventos=D.eventos.filter(z=>z.id!==id);
      D.gastos=(D.gastos||[]).filter(g=>g.evento!==id);
      if(D.eventoActivo===id) D.eventoActivo=D.eventos[0].id;
      await save(); U.sheet=null; return toast('Evento eliminado.');
    }
    case 'evento': D.eventoActivo=b.dataset.id; await save(); U.sheet=null; U.tab='inicio'; return toast('Rendición activa: '+((evActivo()||{}).nombre||'—'));
    case 'evsave': {
      const n=(document.getElementById('en').value||'').trim();
      const f=document.getElementById('ef').value||hoy();
      const l=(document.getElementById('el').value||'').trim();
      if(!n) return toast('Ponle nombre al evento.');
      if(!(yo()||{}).admin) return toast('Solo la administración agenda eventos.');
      D.eventos.push({id:uid(),nombre:n,fecha:f,lugar:l||'Por definir'}); await save(); U.sheet=null; return toast('Evento agendado.');
    }
    case 'invsave': {
      const n=(document.getElementById('in').value||'').trim();
      const c=(document.getElementById('ic').value||'').trim();
      if(n.split(/\s+/).length<2 || !/.+@.+\..+/.test(c)) return toast('Falta nombre completo o correo.');
      if(D.usuarios.some(x=>x.correo.toLowerCase()===c.toLowerCase())) return toast('Ya existe una cuenta con ese correo.');
      D.usuarios.push({nombre:n,cargo:'Carga boletas · acceso por invitación',correo:norm(c),rol:'campo',pin:'',activo:false,externo:true,reset:true});
      await save(); U.sheet=null; return toast('Invitada. Entra con el código '+codigoActual()+' y crea su PIN.');
    }
    case 'pinsave': {
      const p=(document.getElementById('np').value||'').trim();
      if(!/^\d{4,6}$/.test(p)) return toast('El PIN son 4, 5 o 6 dígitos.');
      if(navigator.onLine){
        if(!TOKEN && !(await sbRetomar())) return toast('Sin sesión en la nube: vuelve a entrar y reintenta.');
        const r = await fetch(SB.url+'/auth/v1/user',{method:'PUT',headers:hApi(),body:JSON.stringify({password:p+SUFIJO})});
        if(!r.ok){ const j=await r.json().catch(()=>({})); return toast('La nube rechazó el cambio: '+(j.msg||j.error_description||r.status)); }
      }
      yo().pin=p; await save(); U.sheet=null;
      return toast(navigator.onLine?'PIN actualizado en la nube y en el teléfono.':'PIN actualizado aquí. Se aplicará en la nube al reconectar.');
    }

    case 'enviar': {
      const gs=misGastos(); if(!gs.length) return toast('No hay boletas para enviar.');
      const ev=evActivo();
      const r={id:uid(),usuario:D.sesion,nombreUsuario:u.nombre,evento:ev.id,nombreEvento:ev.nombre,
        total:gs.reduce((a,g)=>a+g.total,0),gastos:gs.map(g=>({...g})),estado:'enviada',enviada:hoy()};
      gs.forEach(g=>{g.estado='enviado';});
      D.rendiciones.push(r); await save();
      if(!navigator.onLine) return toast('Rendición cerrada. Se envía sola al recuperar señal.');
      if(syncCorriendo) await new Promise(res=>{ const e=setInterval(()=>{ if(!syncCorriendo){clearInterval(e);res();} },300); setTimeout(()=>{clearInterval(e);res();},8000); });
      await sincronizar(false);
      if(SYNC.estado==='ok' && SYNC.pend===0) return toast('Rendición enviada. Ya está en la bandeja del aprobador.');
      return toast('Rendición cerrada, pero falta subirla: '+(SYNC.motivo||'sin conexión con la nube.'));
    }
    case 'rend': U.rend=+b.dataset.i; U.firmado=false; return render();
    case 'rendx': U.rend=null; return render();
    case 'sigclr': { const c=document.getElementById('sig'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); U.firmado=false; return render(); }
    case 'aprobar': {
      if(!U.firmado) return toast('Firma para autorizar el pago.');
      const c=document.getElementById('sig');
      const r=D.rendiciones[U.rend];
      r.estado='aprobada'; r.firma=c?c.toDataURL('image/png'):null; r.aprobadaPor=u.nombre; r.aprobada=hoy();
      await save(); U.rend=null; return toast('Autorizada. Ya entra en el CSV para el ERP.');
    }
    case 'devolver': {
      const r=D.rendiciones[U.rend]; r.estado='devuelta'; r.aprobadaPor=u.nombre; await save(); U.rend=null;
      return toast('Devuelta al técnico.');
    }
    case 'csv': { csv((D.gastos||[]).filter(g=>g.usuario===D.sesion),'mis-boletas'); return; }
    case 'csverp': {
      const aprob=(D.rendiciones||[]).filter(r=>r.estado==='aprobada');
      if(!aprob.length) return toast('No hay rendiciones aprobadas todavía.');
      const filas=[]; aprob.forEach(r=>r.gastos.forEach(g=>filas.push({...g,rendicion:r.id,aprobadaPor:r.aprobadaPor,nombreUsuario:r.nombreUsuario,nombreEvento:r.nombreEvento})));
      csv(filas,'erp-rendiciones-aprobadas'); return;
    }
  }
});

function bajar(blob,nombre){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function csv(filas,nombre){
  if(!filas.length) return toast('Nada que exportar.');
  const cab=['fecha','evento','usuario','tipo_documento','rut_proveedor','folio','proveedor','categoria','total','neto','iva','retencion','liquido','estado','aprobada_por'];
  const ev=(id)=>((D.eventos||[]).find(e=>e.id===id)||{}).nombre||id;
  const lin=filas.map(g=>{
    const neto=g.tipo==='Factura'?Math.round(g.total/1.19):g.total;
    const iva=g.tipo==='Factura'?g.total-neto:0;
    const ret=g.tipo==='Honorarios'?Math.round(g.total*RET_HON):0;
    return [g.fecha,g.nombreEvento||ev(g.evento),g.nombreUsuario||g.usuario,g.tipo,g.rut?fmtRut(g.rut):'',g.folio||'',
      g.proveedor||'',g.categoria,g.total,neto,iva,ret,g.total-ret,g.estado||'',g.aprobadaPor||''].map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';');
  });
  bajar(new Blob(['\uFEFF'+cab.join(';')+'\n'+lin.join('\n')],{type:'text/csv;charset=utf-8'}), nombre+'-'+hoy()+'.csv');
  toast('CSV generado. Se abre en Excel y se importa al ERP.');
}

/* cámara */
async function recibirImagen(e){
  const f=e.target.files && e.target.files[0]; e.target.value='';
  if(!f) return;
  const foto = await comprimir(f);
  if(U.fotoPara){
    const g=(D.gastos||[]).find(x=>x.id===U.fotoPara);
    U.fotoPara=null;
    if(g){ g.foto=foto; g.estado='cola'; await save(); U.sheet=null; render(); return toast('Foto adjuntada a la boleta.'); }
    return;
  }
  if(!U.cap) return;
  U.cap.foto = foto;
  render();
}
document.getElementById('cam').addEventListener('change', recibirImagen);
document.getElementById('gal').addEventListener('change', recibirImagen);
function comprimir(file){
  return new Promise((res)=>{
    const img=new Image(), fr=new FileReader();
    fr.onload=()=>{ img.onload=()=>{
      const max=1280, r=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.72));
    }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* firma */
function initSig(){
  const c=document.getElementById('sig'); if(!c || c.dataset.on) return;
  c.dataset.on='1';
  const r=c.getBoundingClientRect(); c.width=r.width*2; c.height=r.height*2;
  const x=c.getContext('2d'); x.scale(2,2); x.strokeStyle='#8f7bff'; x.lineWidth=2.4; x.lineCap='round'; x.lineJoin='round';
  let draw=false;
  const pt=(e)=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  c.addEventListener('pointerdown',(e)=>{draw=true;c.setPointerCapture(e.pointerId);const[a,b2]=pt(e);x.beginPath();x.moveTo(a,b2);
    if(!U.firmado){U.firmado=true;const btn=document.querySelector('[data-a="aprobar"]');if(btn)btn.classList.remove('off');
      const h=document.querySelector('[data-a="sigclr"]').parentNode.querySelector('.hint'); if(h)h.textContent='Firmado';}});
  c.addEventListener('pointermove',(e)=>{if(!draw)return;const[a,b2]=pt(e);x.lineTo(a,b2);x.stroke();});
  c.addEventListener('pointerup',()=>{draw=false;});
}
window.addEventListener('online',()=>render());
window.addEventListener('offline',()=>render());
